name: generate animated snake

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: Pranaya-sht
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#60efff&color_dots=#0d1117,#1b3a5c,#2a5298,#4e94f5,#60efff&color_background=#0d1117
            dist/github-contribution-grid-snake-light.svg?color_snake=#0061ff&color_dots=#ebedf0,#9be9ff,#60cdff,#1e90ff,#0061ff&color_background=#ffffff

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
